name: ブログ最新記事を更新

on:
  schedule:
    - cron: "17 */3 * * *"  # 3時間ごと
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/update_latest.py
      - name: 変更があればコミット
        run: |
          if git diff --quiet; then
            echo "変更なし"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898732+github-actions[bot]@users.noreply.github.com"
          git commit -am "ブログの最新記事リンクを更新"
          git push
